# NetUSBFlash web UI. Installed by packaging/install.sh;
# __PHP_FPM_SOCK__ is replaced with the PHP-FPM socket of the installed PHP version.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/netusbflash/nginx-lan-only.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/netusbflash/tls/cert.pem;
    ssl_certificate_key /etc/netusbflash/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:netusbflash:1m;

    include /etc/netusbflash/nginx-lan-only.conf;

    root /opt/netusbflash/web/public;
    index index.php;
    client_max_body_size 5m;  # settings backups are restored through the UI
    server_tokens off;

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param NETUSBFLASH_SOCKET /run/netusbflash/api.sock;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_read_timeout 300s;
    }

    # File manager (FileGator, https://filegator.io) under /fm/. Every request
    # is checked against the NetUSBFlash login with an auth subrequest; the
    # user's name and role are passed on to FileGator (NUF_USER, NUF_ROLE).
    location = /auth/filemanager {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/netusbflash/web/auth/filemanager.php;
        fastcgi_param HTTPS on;
        fastcgi_param NETUSBFLASH_SOCKET /run/netusbflash/api.sock;
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_pass unix:__PHP_FPM_SOCK__;
    }

    location = /fm {
        return 301 /fm/;
    }

    location ^~ /fm/ {
        auth_request /auth/filemanager;
        auth_request_set $nuf_user $upstream_http_x_nuf_user;
        auth_request_set $nuf_role $upstream_http_x_nuf_role;
        auth_request_set $nuf_locale $upstream_http_x_nuf_locale;
        error_page 401 = @fm_login;

        # Shown in a frame of the NetUSBFlash UI only.
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;

        # FileGator's front end (static files)
        location ~ ^/fm/((?:css|js|fonts|img)/[A-Za-z0-9._/-]+)$ {
            auth_request off;
            alias /opt/netusbflash/filegator/dist/$1;
            expires 7d;
            access_log off;
        }

        client_max_body_size 20m;  # uploads are sent in 1 MB chunks
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/netusbflash/web/filegator/entry.php;
        fastcgi_param SCRIPT_NAME /fm/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param NUF_USER $nuf_user;
        fastcgi_param NUF_ROLE $nuf_role;
        fastcgi_param NUF_LOCALE $nuf_locale;
        fastcgi_param NETUSBFLASH_FILEGATOR_DIR /opt/netusbflash/filegator;
        fastcgi_param NETUSBFLASH_FILEGATOR_DATA /var/cache/netusbflash/filegator;
        fastcgi_param NETUSBFLASH_BROWSE_DIR /srv/netusbflash/usb-stick;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_read_timeout 600s;
        fastcgi_buffering off;  # stream downloads of large recordings
    }

    location @fm_login {
        return 302 /login;
    }

    location ~ \.php$ {
        return 404;
    }
}
