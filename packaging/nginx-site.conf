# NetUSBFlash web UI. Installed by packaging/install.sh;
# __PHP_FPM_SOCK__ is replaced with the PHP-FPM socket of the installed PHP version.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/netusbflash/nginx-lan-only.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/netusbflash/tls/cert.pem;
    ssl_certificate_key /etc/netusbflash/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:netusbflash:1m;

    include /etc/netusbflash/nginx-lan-only.conf;

    root /opt/netusbflash/web/public;
    index index.php;
    client_max_body_size 1m;
    server_tokens off;

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param NETUSBFLASH_SOCKET /run/netusbflash/api.sock;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_read_timeout 300s;
    }

    location ~ \.php$ {
        return 404;
    }
}
